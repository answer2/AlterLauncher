# AlterLauncher game hook rules for libminecraftpe.so
#
# Why this file exists: the native layer used to carry four byte patterns cut
# from one specific Minecraft build. Mojang recompiles and the addresses move,
# so all four stopped matching and every game hook went silent. The data now
# lives here so covering a new build is a text edit, not a rebuild.
#
# Format (line oriented, '#' and ';' start a comment):
#
#   [rule <name>]        opens a block. <name> is only used in the log.
#   min = <version>      inclusive lower bound, dotted numeric. Empty = open.
#   max = <version>      inclusive upper bound. Empty = open.
#   vtable.<key> = <Class>:<slot>
#                        resolved at RUNTIME through RTTI: the mangled class name
#                        is found in .rodata, from there the typeinfo object, from
#                        there the primary vtable, then offset 16 + 8*slot. Needs
#                        no byte pattern, so it survives a recompile for as long
#                        as the class layout holds. The slot is checked against
#                        the number of entries the table really has before it is
#                        used, and the vtable itself is validated (offset_to_top
#                        == 0 and its typeinfo pointer round-trips), so a wrong
#                        class name fails closed instead of patching garbage.
#   sig.<key> = <pattern>
#                        IDA-style byte pattern: "48 8B ?? ??", where "??" is any
#                        byte and "A?"/"?4" match half a byte. Only for functions
#                        that are NOT virtual - RTTI cannot reach those.
#   off.<key> = <rva>    The function's offset inside the .so, read straight out
#                        of a disassembler ("0x923a5d4"). Preferred over a
#                        pattern when both are present: nothing to scan, nothing
#                        to rot. It is also the least portable handle here - only
#                        ever true for the exact build it was recovered from - so
#                        the version window around it is the entire safety story.
#   dat.<key> = d<rva>   An offset INSIDE a heap object rather than inside the
#                        .so: ClientInstance's projection matrix at +0x458, a
#                        GuiData window-size pair at +0x48, ... The leading 'd'
#                        in the VALUE is mandatory - it is what keeps the two
#                        kinds from being confused for each other, and unparses
#                        as an error otherwise. Consumed by mcpe/ClassTree.cpp;
#                        every accessor that takes a dat pin sanity-checks the
#                        bytes it reads, so a rotted pin yields false, never a
#                        crash or a wrong number.
#   dat.<key> = g<Class>:<slot>
#                        The measuring form of the same pin. Instead of trusting
#                        a literal offset that was correct on one build, name a
#                        vtable slot and let the bytes answer: the resolver reads
#                        that slot's body and accepts it only for the pure,
#                        argument-free field reads
#                            ldr w0,[x0,#imm] ; ret     (4-byte field)
#                            ldr x0,[x0,#imm] ; ret     (8-byte field)
#                        taking the offset out of the immediate. A build where
#                        the slot drifted onto a real function fails the shape
#                        test and the pin goes dead — it does not silently read
#                        a different field. Accepted only when EVERY RTTI table
#                        of the class decodes to the same offset; a class whose
#                        tables disagree is ambiguous and is refused. Prefer this
#                        over d<rva> whenever the field has a getter virtual:
#                        one shortlisted slot index beats a byte offset that
#                        only a live object can confirm.
#
# The FIRST block whose version window contains the running game wins. Blocks
# are matched on the numeric prefix only, so a trailing "-beta" is ignored.
#
# A key that the winning block does not define is NOT guessed: that hook is
# skipped and the log says the build is not covered. If NO block matches at all,
# the data compiled into cpp/src/main/cpp/main.cpp applies, which is exactly the
# behaviour this file replaced. So deleting a line here is always safe; adding a
# wrong one only costs that one hook.

# ---------------------------------------------------------------------------
# Older Minecraft builds, derived OFFLINE by the shape alignment (build/
# vtable_align.py + build/multiversion.py, report in build/multiversion.txt).
#
# Measured across the four stripped ARM builds on disk:
#              1.21.91  1.21.101   1.26.45.1     <- CI / Actor table length
#              481/139  484/139    436/138
# ClientInstance::update            25     25        25    (never moved)
# ClientInstance::getLocalPlayer    32     32        32    (never moved)
# Actor::teleportTo / lerpMotion    22/23  22/23     22/23 (never moved)
# Actor::isAlive                    48     48        47    (-1)
# Actor::start/stopSwimming         101/102 101/102  100/101 (-1)
# LocalPlayer::setSprinting         141    141       140   (-1)
# LocalPlayer::setPlayerGameType    214    214       212   (-2)
# BlockSource::getDimensionId       19     19        19
# ClientInstance::getGuiData        247    249       (none: GuiData is inlined)
# dat.minecraftGameField            +0xa8  +0xa8     +0x178
# dat.levelField                    +0xb0  +0xb0     +0x180
# dat.levelRendererField            +0xc0  +0xc0     +0x190
# dat.loopbackPacketSenderField     +0x220 +0x220    +0x1a0
#
# So the drift is real but LOCAL: whole runs of slots move together, which is
# exactly why a number cannot be shared across a version window and why a new
# build is covered by re-running the alignment, not by editing code. The
# 1.21.x field offsets also agree with the reference SDKs' documented
# +0xA0/+0xB0/+0xC0 notes, which those notes were wrong about for 1.26.x.
#
# STATUS OF THESE BLOCKS: derived from file bytes only. Nothing here has been
# run on a device against a 1.21 guest, so every entry is fail-closed at use
# time (RTTI class + slot range + exec/writable region + result vtable checks).
# A pin that turns out to be wrong costs one feature, not the game.
# ---------------------------------------------------------------------------

[rule mcpe-1.21.101]
min = 1.21.101.00
max = 1.21.101.99

vtable.clientInstanceUpdate = ClientInstance:25
vtable.clientInstanceGetLocalPlayerVt = ClientInstance:32
# GuiData is a real virtual getter on 1.21.x (108 bytes, 1:1 run of 22); 1.26
# inlined it into ClientInstance instead. Validated by isGuiData() before use,
# so this rung either produces the object or is skipped.
vtable.getGuiData = ClientInstance:249
vtable.actorTeleportTo = Actor:22
vtable.actorLerpMotion = Actor:23
vtable.actorIsAlive = Actor:48
vtable.actorStartSwimming = Actor:101
vtable.actorStopSwimming = Actor:102
vtable.localPlayerSetSprinting = LocalPlayer:141
vtable.playerSetGameType = LocalPlayer:214
vtable.blockSourceGetDimensionId = BlockSource:19
dat.minecraftGameField = d0xa8
dat.levelField = d0xb0
dat.levelRendererField = d0xc0
dat.loopbackPacketSenderField = d0x220

[rule mcpe-1.21.91]
