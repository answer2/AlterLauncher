# BedrockTools-portable patterns (QYCottage/BedrockTools, GPLv3 — only the
# byte-level facts are reused here, never code). A pattern is a CALLABLE
# handle even where shadowhook cannot patch (island dead band), and it is
# what SigScanner resolves by name. These were measured to match THIS exact
# build offline; on a recompile they either still match or the resolve logs
# one miss, so they sit alongside — never instead of — the RTTI paths.
sig.guiDataAddMessage = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 59 D0 3B D5 F3 03 00 AA F4 03 05 AA 28 17 40 F9
sig.clientInstanceGetLocalPlayer = ? ? ? D1 ? ? ? A9 ? ? ? F9 ? ? ? 91 53 D0 3B D5 E8 03 00 AA ? ? ? 91 ? ? ? F9 ? ? ? 91 ? ? ? F8 ? ? ? 95 ? ? ? 91 ? ? ? 95 ? ? ? 36 ? ? ? 91 ? ? ? 52 ? ? ? 94
sig.clientInstanceGetPacketSender = ? ? ? F9 C0 03 5F D6 ? ? ? F9 ? ? ? F9 ? ? ? F9 20 00 1F D6 ? ? ? F9 ? ? ? F9 ? ? ? F9 20 00 1F D6 ? ? ? A9

# Data pins for the typed API layer (mcpe/ClassTree.cpp). From the reference
# SDK layout notes for 1.26.x / 3.4-era Android: CI matrix +0x458, CI fov pair
# +0x498 (+0x14 apart), GuiData game size +0x48. NOT yet verified against this
# device's live objects — the accessors validate every value they read, so a
# wrong pin costs the feature (worldToScreen returns false), not the game.
dat.projectionMatrix = d0x458
dat.fovXY = d0x498
dat.guiDataWindowSize = d0x48

# ClientInstance getters verified offline against libminecraftpe-1.26.45.1.so
# (RTTI vtable @0x11e3b2c8, 436 slots; each slot read from its own body). Slots
# 31/32/83 match BedrockTools exactly, so the BT slot map transfers to this build.
# vtable.clientInstanceGetRegion = ClientInstance:31  ; DISABLED: slot31 is a
# complex function (0x1d0 frame) on 1.26.45.1, unsafe to call as a bare pointer getter
# vtable.clientInstanceGetLocalPlayerVt = ClientInstance:32  ; DISABLED: slot32
# returns a STRUCT via x8 (mov x19,x8 in prologue) - calling it as ptr(*)(void*)
# writes through an undefined x8 and crashes. BT's slot numbers are 1.21-era.
vtable.clientInstanceGetOptions = ClientInstance:201
vtable.getGuiData = ClientInstance:101
dat.minecraftGameField = d0x178
dat.levelRendererField = d0x190
dat.loopbackPacketSenderField = d0x1a0
dat.optionsField = d0x2E0
dat.guiDataField = d0x660
# GuiData is an inline sub-object of ClientInstance on 1.26.45.1 (no pointer
# member exists): the game's own addChatMessage 'this' = ci+0xDE0. Certified
# by structural anchors (+0xA0 pane vtable, +0x140/+0x188 deque pairs).
dat.guiDataSubobject = d0xDE0
# ---- field offsets resolved offline from libminecraftpe-1.26.45.1.so (RTTI +
#      vtable-getter scan; CI vtable @0x11e3b2c8, 436 slots). Each was read
#      from the getter's 'ldr x0,[x0,#off]; ret' body, so it is ground truth
#      for THIS build, not a version-drifted reference value. ----
# MinecraftGame* = ClientInstance+0x178 (slot 80 getter; slot 83 thunk loads it).
dat.minecraftGameField = d0x178
# LevelRenderer* = ClientInstance+0x190 (slot 187; matches BedrockTools mLevelRenderer).
dat.levelRendererField = d0x190
# LoopbackPacketSender* = ClientInstance+0x1a0 (slot 293, sig-verified; ref 3.4 said 0xD0 = drift).
dat.loopbackPacketSenderField = d0x1a0
# Options* = ClientInstance+0x308 (slot 201 getter body).
dat.optionsField = d0x2E0
# GuiData* = ClientInstance+0x660 (slot 101 getter). CANDIDATE: GuiData is
# non-polymorphic (no RTTI vtable), so it is validated at runtime by its
# resolution vec2s at +0x40/+0x48/+0x50, and the getter-probe self-heals if
# this drifts. Reference 3.4 had it at 0x688.
dat.guiDataField = d0x660
# GuiData is an inline sub-object of ClientInstance on 1.26.45.1 (no pointer
# member exists): the game's own addChatMessage 'this' = ci+0xDE0. Certified
# by structural anchors (+0xA0 pane vtable, +0x140/+0x188 deque pairs).
dat.guiDataSubobject = d0xDE0


