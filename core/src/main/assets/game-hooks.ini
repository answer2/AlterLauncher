#
# The STRING-LITERAL route does not work here, measured, not assumed: of the
# 21 literals ida_features.py pulled out of these functions in the symbolised
# build, every discriminating one is absent from libminecraftpe-1.26.45.1.so
# ("Runtime ID has not been set!", "mLevel", "runtimeID",
# "Entity was not placed in a level" all -> 0 occurrences). The literals that DO
# survive are the shared assert texts ("Accessing a null NonOwnerPointer" and
# friends), and those are referenced by 906 functions each — they identify
# nothing. Source paths survive as text but are dead data: the build-host prefix
# differs ("\a\_work\1\s/..." vs "./...") and even matched on the path suffix,
# e.g. handheld/src/common/world/actor/Actor.cpp, ZERO adrp sites in .text
# reference it. Conclusion: the Android release build keeps the strings but
# compiled out the calls that used them. Do not spend another pass on this.
#
# The ARM64 signature route was tried and also came out empty, measured with
# tools/sdk-re/sig_from_symlib.py. There IS an ARM64 symbolised build on this
# machine — D:\逆向分析\libminecraftpe(1).so, 279627 defined symbols of which
# 2488 are game-class methods — so this is not the usual "different
# architecture" excuse. It is simply the wrong version: that build is ~1.20.x
# (it has entt and EntityContext but no SharedTypes, no RuntimeIDComponent, no
# ActorAttribute), and its Actor still has 262 virtuals where 1.21.131 has 139.
# The ECS componentisation deleted them, and every getter was rewritten around
# a component function table in between. Result: 0 of 18 gap functions produced
# a signature that matches this build even once.
#   15 stale (zero hits), 2 too short to sign at all (Actor::getPos and
#   Actor::getRuntimeID are literally `ldr`/`add` + `ret`, which no shape can
#   tell apart from the hundreds of identical accessors), 1 ambiguous
#   (MinecraftGame::isInGame, 32 aligned hits).
# For reference, Actor::getHealth in that build is:
#   ldr x8,[x0] / adrp x1,.. / ldr x8,[x8,#0x618] / ldr x1,[x1,#0x748] / blr x8
# i.e. it calls through a component pointer table that does not exist in this
# shape any more. Conclusion: cross-version signature mining needs a build
# within a version or two, not six. There is no such build here — the full ARM64
# inventory is libminecraftpe(1).so (~1.20, symbolised),
# libminecraftpeEdu1_21_131_1.so (1.21.131, game code stripped by
# -fvisibility=hidden, STL/webrtc/v8 symbols only), and three stripped 1.21/1.29
# builds. So these keys need a device-side probe, not another offline pass.
#
# What the older ARM64 build IS good for: reading the 1.20 shape of a function
# (tools/sdk-re/symlib_vtables.py dumps every vtable with slot->name resolved
# through GLOB_DAT relocations), and the API-drift record it exposes —
#   Actor::swing()          became swing(ActorSwingSource)
#   Actor::stopRiding(bbb)  became stopRiding(bbbb)
#   Actor::getPos()         renamed getPosition()
#   Options::getPlayerViewPerspective  moved to BaseOptions

