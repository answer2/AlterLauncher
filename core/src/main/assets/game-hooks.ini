dat.actorDimensionField = d0x68

# 0xce6b34f6 is the 32-bit key compared at pool+8 by the read/write/write-zero
# component family. Its derivation from the text "minecraft:health" is NOT
# proven: FNV, Murmur3, CRC, Java and xxHash candidates all disagree, and the
# linked farmhash PLT entry only proves a third-party dependency uses farmhash.
# The read function at 0xec9b700 is byte-identical to 0xf578044 in 1.26.52.3 and
# the read-only walk reproduces it exactly, but both returned 0.0 for a live
# LocalPlayer across three samples (including after damage). Therefore this key
# and off.actorGetHealth remain diagnostic-only; Actor::getHealth() fails closed.
dat.healthComponentHash = d0xce6b34f6
# The getter's first two loads say where the entity lives: `ldr x9,[x0,#0x10]`
# takes the registry, `ldr w8,[x0,#0x18]` the entt id - so the EntityContext base
# is Actor+0x0 with those two members, not the +0x1d8 inline candidate that
# Actor::getRegion() probed and rejected as non-polymorphic.
dat.actorEntityContextField = d0x10
dat.actorEntityIdField = d0x18
# Function address, read by probeHealthGetter only: it decodes this getter's own
# words (prologue, the registry load above, the immediate pair for the pinned
# hash, and a float LOAD 0xC0 bytes in) before it will call, and it is called only
# after the read-only walk proved the component exists - the game's own failure
# path is `bl 0xec9b7cc` -> `b _ZSt9terminatev@plt`, which nothing can catch.
off.actorGetHealth = 0xec9b700
# Actor:13 was called on-device three times only after its four words decoded as
