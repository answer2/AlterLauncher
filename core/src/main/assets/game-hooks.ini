# AlterLauncher game hook rules for libminecraftpe.so
#
# Why this file exists: the native layer used to carry four byte patterns cut
# from one specific Minecraft build. Mojang recompiles and the addresses move,
# so all four stopped matching and every game hook went silent. The data now
# lives here so covering a new build is a text edit, not a rebuild.
#
# Format (line oriented, '#' and ';' start a comment):
#
#   [rule <name>]        opens a block. <name> is only used in the log.
#   min = <version>      inclusive lower bound, dotted numeric. Empty = open.
#   max = <version>      inclusive upper bound. Empty = open.
#   vtable.<key> = <Class>:<slot>
#                        resolved at RUNTIME through RTTI: the mangled class name
#                        is found in .rodata, from there the typeinfo object, from
#                        there the primary vtable, then offset 16 + 8*slot. Needs
#                        no byte pattern, so it survives a recompile for as long
#                        as the class layout holds. The slot is checked against
#                        the number of entries the table really has before it is
#                        used, and the vtable itself is validated (offset_to_top
#                        == 0 and its typeinfo pointer round-trips), so a wrong
#                        class name fails closed instead of patching garbage.
#   sig.<key> = <pattern>
#                        IDA-style byte pattern: "48 8B ?? ??", where "??" is any
#                        byte and "A?"/"?4" match half a byte. Only for functions
#                        that are NOT virtual - RTTI cannot reach those.
#   off.<key> = <rva>    The function's offset inside the .so, read straight out
#                        of a disassembler ("0x923a5d4"). Preferred over a
#                        pattern when both are present: nothing to scan, nothing
#                        to rot. It is also the least portable handle here - only
#                        ever true for the exact build it was recovered from - so
#                        the version window around it is the entire safety story.
#   dat.<key> = d<rva>   An offset INSIDE a heap object rather than inside the
#                        .so: ClientInstance's projection matrix at +0x458, a
#                        GuiData window-size pair at +0x48, ... The leading 'd'
#                        in the VALUE is mandatory - it is what keeps the two
#                        kinds from being confused for each other, and unparses
#                        as an error otherwise. Consumed by mcpe/ClassTree.cpp;
#                        every accessor that takes a dat pin sanity-checks the
#                        bytes it reads, so a rotted pin yields false, never a
#                        crash or a wrong number.
#
# The FIRST block whose version window contains the running game wins. Blocks
# are matched on the numeric prefix only, so a trailing "-beta" is ignored.
#
# A key that the winning block does not define is NOT guessed: that hook is
# skipped and the log says the build is not covered. If NO block matches at all,
# the data compiled into cpp/src/main/cpp/main.cpp applies, which is exactly the
# behaviour this file replaced. So deleting a line here is always safe; adding a
# wrong one only costs that one hook.

# ---------------------------------------------------------------------------
# Older Minecraft builds, derived OFFLINE by the shape alignment (build/
# vtable_align.py + build/multiversion.py, report in build/multiversion.txt).
#
# Measured across the four stripped ARM builds on disk:
#              1.21.91  1.21.101   1.26.45.1     <- CI / Actor table length
#              481/139  484/139    436/138
# ClientInstance::update            25     25        25    (never moved)
# ClientInstance::getLocalPlayer    32     32        32    (never moved)
# Actor::teleportTo / lerpMotion    22/23  22/23     22/23 (never moved)
# Actor::isAlive                    48     48        47    (-1)
# Actor::start/stopSwimming         101/102 101/102  100/101 (-1)
# LocalPlayer::setSprinting         141    141       140   (-1)
# LocalPlayer::setPlayerGameType    214    214       212   (-2)
# BlockSource::getDimensionId       19     19        19
# ClientInstance::getGuiData        247    249       (none: GuiData is inlined)
# dat.minecraftGameField            +0xa8  +0xa8     +0x178
# dat.levelField                    +0xb0  +0xb0     +0x180
# dat.levelRendererField            +0xc0  +0xc0     +0x190
# dat.loopbackPacketSenderField     +0x220 +0x220    +0x1a0
#
# So the drift is real but LOCAL: whole runs of slots move together, which is
# exactly why a number cannot be shared across a version window and why a new
# build is covered by re-running the alignment, not by editing code. The
# 1.21.x field offsets also agree with the reference SDKs' documented
# +0xA0/+0xB0/+0xC0 notes, which those notes were wrong about for 1.26.x.
#
# STATUS OF THESE BLOCKS: derived from file bytes only. Nothing here has been
# run on a device against a 1.21 guest, so every entry is fail-closed at use
# time (RTTI class + slot range + exec/writable region + result vtable checks).
# A pin that turns out to be wrong costs one feature, not the game.
# ---------------------------------------------------------------------------

[rule mcpe-1.21.101]
min = 1.21.101.00
max = 1.21.101.99

vtable.clientInstanceUpdate = ClientInstance:25
vtable.clientInstanceGetLocalPlayerVt = ClientInstance:32
# GuiData is a real virtual getter on 1.21.x (108 bytes, 1:1 run of 22); 1.26
# inlined it into ClientInstance instead. Validated by isGuiData() before use,
# so this rung either produces the object or is skipped.
vtable.getGuiData = ClientInstance:249
vtable.actorTeleportTo = Actor:22
vtable.actorLerpMotion = Actor:23
vtable.actorIsAlive = Actor:48
vtable.actorStartSwimming = Actor:101
vtable.actorStopSwimming = Actor:102
vtable.localPlayerSetSprinting = LocalPlayer:141
vtable.playerSetGameType = LocalPlayer:214
vtable.blockSourceGetDimensionId = BlockSource:19
dat.minecraftGameField = d0xa8
dat.levelField = d0xb0
dat.levelRendererField = d0xc0
dat.loopbackPacketSenderField = d0x220

[rule mcpe-1.21.91]
min = 1.21.91.00
max = 1.21.91.99

vtable.clientInstanceUpdate = ClientInstance:25
vtable.clientInstanceGetLocalPlayerVt = ClientInstance:32
vtable.getGuiData = ClientInstance:247
vtable.actorTeleportTo = Actor:22
vtable.actorLerpMotion = Actor:23
vtable.actorIsAlive = Actor:48
vtable.actorStartSwimming = Actor:101
vtable.actorStopSwimming = Actor:102
vtable.localPlayerSetSprinting = LocalPlayer:141
vtable.playerSetGameType = LocalPlayer:214
vtable.blockSourceGetDimensionId = BlockSource:19
dat.minecraftGameField = d0xa8
dat.levelField = d0xb0
dat.levelRendererField = d0xc0
dat.loopbackPacketSenderField = d0x220

# ---------------------------------------------------------------------------
# LeviLaunchroid mod-compatibility hooks (M4, docs/levi-compat-design.md 4.4).
#
# These blocks mirror preloader-android's own signature-rules file (schema
# revision 3, upstream LiteLDev/preloader-android, Apache-2.0 per LICENSES/ +
# NOTICE) — the same windows, the same first-match-wins order, the same keys.
# PauseMenu/HudScreen ctor/dtor are non-virtual, so they can only be reached
# by byte pattern; ClientInstance::isShowingMenu is virtual, so the index
# goes through RTTI exactly like clientInstanceUpdate below. Their scanner
# runs on the loaded image while ours (FindSignature) runs on file bytes;
# that is safe here because every relocated ADRP/ADD word in these patterns
# is fully wildcarded.
#
# Measured anchors on our device build (libminecraftpe 1.26.45.1, rule #1):
#   pauseMenuDtor 0xA012CFC  pauseMenuOpen 0xA012E88
#   hudScreenDtor 0xA094F14  hudScreenOpen 0xA0A181C   (each exactly 1 hit)
#   isShowingMenuVtableIndex 150 -> vtable 0x11E3B2C8+16+8*150 -> fn 0x944EEA4;
#   slot 25 of that same table is clientInstanceUpdate (anchor 0x943EC54) —
#   their vtable numbering and ours agree exactly.
# ---------------------------------------------------------------------------

[rule levi-1.26.50]
min = 1.26.50.00
max = 1.26.99.99

sig.pauseMenuDtor = ? ? ? A9 ? ? ? A9 FD 03 00 91 ? ? ? ? ? ? ? 91 F3 03 00 AA ? ? ? 91 ? ? ? F9 ? ? ? F9 ? ? ? 91 ? ? ? 95 ? ? ? F9 ? ? ? B4 ? ? ? 95 ? ? ? 91
sig.pauseMenuOpen = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 ? ? ? D5 F3 03 00 AA ? ? ? 52 ? ? ? F9 ? ? ? F8 ? ? ? F9
sig.hudScreenDtor = ? ? ? A9 ? ? ? F9 ? ? ? A9 FD 03 00 91 ? ? ? ? ? ? ? 91 F3 03 00 AA ? ? ? F9 ? ? ? 91 ? ? ? F9 ? ? ? F9 ? ? ? F9
sig.hudScreenOpen = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 ? ? ? D5 F3 03 00 AA ? ? ? F9 ? ? ? F8 ? ? ? 97 ? ? ? F9 ? ? ? 97
vtable.isShowingMenu = ClientInstance:151

# Parity with levi-1.26.40, derived by build/derive_rule.py. Every value below is
# one of three kinds of evidence, never a carried-over number:
#   sig.*  the 1.26.40 pattern still matches THIS build exactly once and on a
#          4-byte boundary, so the pattern is version-portable (checked with
#          build/inicheck.py, not assumed);
#   vtable.*  this build's own index, from the RTTI table aligned against the
#          symbolised reference (run = 1:1 neighbourhood agreement; under 5 would
#          have been left out);
#   dat.*  read out of the one-instruction getter's own displacement, or from the
#          aligned field the reference names.
#
# Drift 45.1 -> 52.3, for the record: ClientInstance fields all move +0x10
# (0x178->0x188, 0x180->0x190, 0x190->0x1a0, 0x1a0->0x1b0) while +0xC80->0xD08 in
# the Options region; Actor startSwimming/stopSwimming -1 (100->99, 101->100);
# LocalPlayer setSprinting/setPlayerGameType -1 (140->139, 212->211);
# ClientInstance isShowingMenu +1 (150->151); teleportTo/lerpMotion/isAlive and
# getLocalPlayer/getPacketSender's slot 32 unchanged. A slot number therefore
# never crosses this boundary as a number - which is why the retired
# vtable.clientInstanceGetLocalPlayerVt stays retired here too and getLocalPlayer
# is reached by signature only.
sig.clientInstanceGetLocalPlayer = ? ? ? D1 ? ? ? A9 ? ? ? F9 ? ? ? 91 53 D0 3B D5 E8 03 00 AA ? ? ? 91 ? ? ? F9 ? ? ? 91 ? ? ? F8 ? ? ? 95 ? ? ? 91 ? ? ? 95 ? ? ? 36 ? ? ? 91 ? ? ? 52 ? ? ? 94
sig.clientInstanceGetPacketSender = ? ? ? F9 C0 03 5F D6 ? ? ? F9 ? ? ? F9 ? ? ? F9 20 00 1F D6 ? ? ? F9 ? ? ? F9 ? ? ? F9 20 00 1F D6 ? ? ? A9

# Two rungs the native layer asks for by name and NO 1.26 block used to define, so
# SigScanner::resolve returned 0 and the step did nothing at all on this version:
#   mcpe/GuiData.cpp:76      resolve("guiDataDisplayChatMessage")
#   mcpe/GameSDK.cpp:429     resolve("clientInstanceGetMinecraftGame")
# The first is BedrockTools' own SignatureId::GuiDataDisplayChatMessage pattern,
# measured unique in both samples and landing on the same function as
# sig.guiDataAddMessage above (45.1 0x923ab54, 52.3 0x96108a4) - which is the
# evidence that the chat wrapper and displayChatMessage are one and the same.
# The second was generated from the RTTI+reference-derived address of
# ClientInstance::getMinecraftGame (45.1 0x944c280, 52.3 0x98111b4) by
# build/make_sig.py, which emits a pattern only when it matches exactly once at
# that address in every build given; its masked head word is the `ldr x0,[x0,#off]`
# field load, an independent confirmation of dat.minecraftGameField.
# Not pinned, because it cannot be proven offline: sig.clientInstanceGetGuiData -
# getGuiData's own body differs between these two builds (a pattern from 1.26.45.1
# also matches its neighbour getGuidedFlowManager, and does not match here at all),
# so GuiData keeps coming from the structural rung instead.
sig.guiDataDisplayChatMessage = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 59 D0 3B D5 F3 03 00 AA F4 03 05 AA
sig.clientInstanceGetMinecraftGame = ? ? ? ? C0 03 5F D6 FF 43 01 D1 FD 7B 02 A9 ? ? ? ? F4 4F 04 A9 FD 83 00 91 ? ? ? ? F3 03 02 AA F4 03 01 AA ? ? ? ? ? ? ? ? ? ? ? ? 08 00 40 F9

# Chat route (GameSdk::deliverMessage). Same type-1 chat wrapper as 1.26.40; on
# both builds this function is what BedrockTools' SignatureId::
# GuiDataDisplayChatMessage resolves to (45.1 0x923ab54, 52.3 0x96108a4), while
# BedrockTools' own GuiDataAddMessage is a different, smaller function
# (45.1 0x9237544, 52.3 0x960d294) - recorded here so the key name is not read as
# a claim about which one GuiData::addMessage is.
sig.guiDataAddMessage = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 59 D0 3B D5 F3 03 00 AA F4 03 05 AA 28 17 40 F9
# 0x96108a4 is this same pattern's address here, so the RVA follows from the
# pattern rather than from the 1.26.45.1 number.
off.guiDataAddMessage = 0x96108a4

# NOT derived, deliberately absent (see derive_rule.py's gap report):
#   off.guiDataSendClientMessage, off.joinMultiplayerGame - no pattern and no
#     second-party alias proves where they moved to.
#   dat.guiDataSubobject (ci+0xDE0), dat.actorPosInMovement,
#     dat.actorMotionInMovement, dat.playerRotPtr, dat.actorRegionField,
#     dat.fovXY, dat.projectionMatrix, dat.guiDataWindowSize - a heap/inline
#     layout fact, not readable from any single getter; the read-only structural
#     scan discovers these and logs the offset for a later pin.
vtable.actorTeleportTo = Actor:22
vtable.actorLerpMotion = Actor:23
vtable.actorIsAlive = Actor:47
vtable.actorStartSwimming = Actor:99
vtable.actorStopSwimming = Actor:100
vtable.localPlayerSetSprinting = LocalPlayer:139
vtable.playerSetGameType = LocalPlayer:211
vtable.blockSourceGetDimensionId = BlockSource:19

dat.actorMovementPtr = d0x208
dat.minecraftGameField = d0x188
dat.levelField = d0x190
dat.levelRendererField = d0x1a0
dat.loopbackPacketSenderField = d0x1b0
dat.optionsField = d0xd08

[rule levi-1.26.40]
min = 1.26.40.00
max = 1.26.49.99

sig.pauseMenuDtor = ? ? ? A9 ? ? ? A9 FD 03 00 91 ? ? ? ? ? ? ? 91 F3 03 00 AA ? ? ? 91 ? ? ? F9 ? ? ? F9 ? ? ? 91 ? ? ? 95 ? ? ? F9 ? ? ? B4 ? ? ? 95 ? ? ? 91
sig.pauseMenuOpen = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 ? ? ? D5 F3 03 00 AA ? ? ? 52 ? ? ? F9 ? ? ? F8 ? ? ? F9
sig.hudScreenDtor = ? ? ? A9 ? ? ? F9 ? ? ? A9 FD 03 00 91 ? ? ? ? ? ? ? 91 F3 03 00 AA ? ? ? F9 ? ? ? 91 ? ? ? F9 ? ? ? F9 ? ? ? F9
sig.hudScreenOpen = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 ? ? ? D5 F3 03 00 AA ? ? ? F9 ? ? ? F8 ? ? ? 97 ? ? ? F9 ? ? ? 97
vtable.isShowingMenu = ClientInstance:150

# Chat route (GameSdk::deliverMessage): GuiData::addMessage body, recovered
