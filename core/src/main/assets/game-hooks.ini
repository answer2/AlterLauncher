# ---------------------------------------------------------------------------
# Catch-all for every other 1.26.x build: the chat/multiplayer hooks we own
# plus the per-frame tick. MUST stay LAST — the levi-* windows above win for
# the builds they cover, and this one would otherwise swallow them.
# ---------------------------------------------------------------------------

[rule minecraft-1.26]
min = 1.26.0.0
max =

# ClientInstance::update(bool) - the per-frame tick. Hooking it hands the
# launcher a live ClientInstance pointer, which every later game feature needs.
#
# Slot 25 is not a guess: the 1.21.131 macOS build has update(bool) at slot 25 of
# ClientInstance, and on the 1.26.45.1 ARM build slots 18..55 agree with it one
# for one by function size and call count (25 is the 3480-byte, 102-call giant).
# Verified on device: the resolved address equals the offline anchor
# 0x943ec54 (file offset from the .so base) and the hook fired once per frame.
vtable.clientInstanceUpdate = ClientInstance:25

# The three non-virtual chat/multiplayer entries, recovered for 1.26.45.1 by
# crossing the reference builds offline (see docs/baseline-android16.md). The
# keys are the ones main.cpp asks the rule file for.
#   sendClientMessage   1.21.91 0x5faec4c  ->  1.26.45.1 0x923a22c
#   addMessage          1.21.91 0x5faeef0  ->  1.26.45.1 0x923a5d4
#   joinMultiplayerGame 1.21.101 0x62c4d48 ->  1.26.45.1 0x95975d4
off.guiDataSendClientMessage = 0x923a22c
off.guiDataAddMessage = 0x923a5d4
off.joinMultiplayerGame = 0x95975d4

# Why those three pairs are the same function, since none of them has a byte
# pattern that survives the recompile and addMessage materialises no literal at
# all. Four structural things agree:
#   * addMessage's callee multiset maps one to one: 6 + 5 + 2 of three string
#     helpers, 13 BL total in both builds. Its prologue still opens
#     "str d8, [sp, #-0x50]!" where 1.21 had -0x60.
#   * sendClientMessage calls addMessage at +0x118 in BOTH builds.
#   * the two functions after addMessage keep their shape, including a 0xa8-byte,
#     5-BL helper that sendClientMessage calls exactly twice in both.
#   * joinMultiplayerGame is pinned by literals instead: it is the only function
#     in 1.26 materialising "joining_realm_game", "joining_xboxLive_game" and
#     "ServiceProvider", and it holds the self-naming telemetry string
#     "Async<void> MinecraftGame::_joinMultiplayerGame(const Social::..." at
#     +0xb24 (1.21: +0x828).
#
# HOOKABILITY, read this before trusting the log. shadowhook 2.0.1 places its
# exit trampoline in an island it has to find within +/-128 MB of the target, and
# libminecraftpe.so is mapped as one contiguous 284 MiB r-xp segment (0x11c44000
# bytes), so any address from 128 MiB to 156 MiB into it is unhookable by an
# inline hook: its whole reach window lands inside the library's own mapping. All
# three offsets above sit in that dead band - sendClientMessage and addMessage at
# 146.3 MiB, joinMultiplayerGame at 149.3 MiB - which is also why
# ClientInstance::update (148.3 MiB) goes through a vtable slot instead. So
# expect "alloc island for exit failed" here, and treat that as a statement about
# the mapping, not about the offset being wrong. The way to act on it is to hook
# a caller outside the band, or to patch a vtable slot - not to re-cut the
# pattern.
#
# What is still true from the earlier attempts, so the next one starts further
# along: the old byte patterns match two older ARM builds intact - 1.21.91-era
# libminecraftpe-1291.so and 1.21.101-era libminecraftpe-121101.so - which is
# what made this crossing possible; in 1.26 the .rodata lang strings are a
# data-driven key pool with no ADRP site materialising most of them; and all four
# builds are stripped (.dynsym only) with no relocations into GuiData's
# non-virtual members, so there is no name to read.
#
# Minecraft::update is deliberately absent: it is the pre-RTTI way to obtain the
# game instance, and the vtable hook above owns it now.
