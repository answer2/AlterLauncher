sig.hudScreenDtor = ? ? ? A9 ? ? ? F9 ? ? ? A9 FD 03 00 91 ? ? ? ? ? ? ? 91 F3 03 00 AA ? ? ? F9 ? ? ? 91 ? ? ? F9 ? ? ? F9 ? ? ? F9
sig.hudScreenOpen = ? ? ? D1 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? A9 ? ? ? 91 ? ? ? D5 F3 03 00 AA ? ? ? F9 ? ? ? F8 ? ? ? 97 ? ? ? F9 ? ? ? 97
