# Parity with levi-1.26.40, derived by build/derive_rule.py. Every value below is
# one of three kinds of evidence, never a carried-over number:
#   sig.*  the 1.26.40 pattern still matches THIS build exactly once and on a
#          4-byte boundary, so the pattern is version-portable (checked with
#          build/inicheck.py, not assumed);
#   vtable.*  this build's own index, from the RTTI table aligned against the
#          symbolised reference (run = 1:1 neighbourhood agreement; under 5 would
#          have been left out);
#   dat.*  read out of the one-instruction getter's own displacement, or from the
#          aligned field the reference names.
#
# Drift 45.1 -> 52.3, for the record: ClientInstance fields all move +0x10
# (0x178->0x188, 0x180->0x190, 0x190->0x1a0, 0x1a0->0x1b0) while +0xC80->0xD08 in
# the Options region; Actor startSwimming/stopSwimming -1 (100->99, 101->100);
# LocalPlayer setSprinting/setPlayerGameType -1 (140->139, 212->211);
# ClientInstance isShowingMenu +1 (150->151); teleportTo/lerpMotion/isAlive and
# getLocalPlayer/getPacketSender's slot 32 unchanged. A slot number therefore
# never crosses this boundary as a number - which is why the retired
# vtable.clientInstanceGetLocalPlayerVt stays retired here too and getLocalPlayer
# is reached by signature only.
sig.clientInstanceGetLocalPlayer = ? ? ? D1 ? ? ? A9 ? ? ? F9 ? ? ? 91 53 D0 3B D5 E8 03 00 AA ? ? ? 91 ? ? ? F9 ? ? ? 91 ? ? ? F8 ? ? ? 95 ? ? ? 91 ? ? ? 95 ? ? ? 36 ? ? ? 91 ? ? ? 52 ? ? ? 94
