# Frame-matrix pins for the typed API layer (mcpe/client/ClientInstance.cpp).
# RETIRED: dat.projectionMatrix=d0x458 / dat.fovXY=d0x498 on ClientInstance.
# They were never corroborated by any reference mod (surveyed across
# BedrockTools, Horion, Latite, orphan, solstice and ProtoHax: none reads a
# projection matrix as a ClientInstance member), and the in-world probe settled
# it - ci+0x458 holds a 3x3 basis with a zero first row
# ([4]-0.57705 [6]-0.81671 / [8]0.57705 [10]-0.81671 / [13]0.8388 [14]-0.54443,
# [15]0), not a view matrix, and no perspective-shaped block exists anywhere in
# ClientInstance+0..0x2000.
#
# MEASURED ON DEVICE 2026-10-05 (1.26.45.1, levi-1.26.40, base 0x73e9a07000),
# from readViewProjection's own layout probe against the live objects:
#   projection probe: GameRenderer found at MinecraftGame+0x1188
#   projection probe: GameRenderer measured view=+0x398 projection=+0x418 (gap 0x80)
#   projection probe: GameRenderer+0x418 m0=0.70656 m5=1.5407 m10=-1 m11=-1
#                     m14=-0.05 m15=0   -0x80=view
# That block is a textbook column-major GL perspective: m[3]=m[7]=m[15]=0,
# m[11]=-1 (so clip.w = -view.z), m[10]=-1 with m[14]=-0.05 i.e. an infinite far
# plane and near = 0.05. Independent confirmation, not just shape-matching:
# m5/m0 = 1.5407/0.70656 = 2.1805, and the same session's GuiData window size is
# 2355x1080 = 2.1806 - m0 is f/aspect and m5 is f, so their ratio must be the
# aspect ratio. view15=1.000 and an orthonormal 3x3 at +0x398 make that the view
# matrix. Latite's GameRenderer keeps the pair exactly 0x80 apart too (+0x388 /
# +0x408), which is the gap the probe tries first.
#
# GameRenderer is reached by RTTI (typeinfo@0x11fc9908, vtable@0x11fc85b8, 2
# slots; standalone name copy at 0x2d37674), so dat.gameRendererField is a
# convenience pin over a scan that already certifies the class. readViewProjection
# discovers all three at runtime and re-validates both shapes every call, so an
# offset that stops matching self-heals rather than pinning the feature off.
dat.gameRendererField = d0x1188
dat.grViewMatrix = d0x398
dat.grProjectionMatrix = d0x418
dat.guiDataWindowSize = d0x48

# Dimension id, found by reading the accessor instead of copying an offset.
# Dimension's primary vtable (RTTI typeinfo@0x12255228 family, header 0x123511e8,
# 50 slots) has exactly one int-returning trivial getter, slot 3 @0xf97c108:
#   ldr w0, [x0, #0x170]
#   ret
# So the id is Dimension+0x170 on this build - NOT the +0x140 / +0x138 that two
# reference projects claim for other versions. dat.dimensionIdField is left
# UNPINNED anyway: Dimension::getDimensionId() asks for this slot and
# detail::verifiedGetterOffset() decodes the two instruction words at runtime and
# takes the offset from the imm12 it finds. The rule therefore carries no
# version-sensitive number at all, and a slot that shifted (or is one of the
# `mov w0,#-1` / `mov w0,wzr` stubs this table also contains) fails the shape
# test instead of reading the wrong field. Proven offline against this .so: the
# decoder accepts 0xf97c108 -> 0x170 and rejects both stub bodies.
#
# The Dimension object itself is not an Actor member, and BlockSource's constructor
# (0xf250d24) is the evidence for where it lives:
#   stp x20, x25, [x19, #0x28]  -> +0x28 = arg x1, +0x30 = arg x3
#   str x22,      [x19, #0x38]  -> +0x38 = arg x2
#   mov x0, x22 ; bl 0xf97c070  -> strh result at +0x40    both callees sit inside
#   mov x0, x22 ; bl 0xf97c078  -> strh result at +0x42    the Dimension function
#   (cluster: 0xf97bedc / 0xf97c108 / 0xf97c1a4)           cluster, and the two
#   int16 results are min / max height                     so x2 is the Dimension
# BlockSource's vtable confirms it: slots 36/37/38 @0xf251854 return +0x38 verbatim.
#
# Actor reaches that BlockSource from two places, and the old single pin assumed
# only one: Actor+0x1c8 is a null-checked POINTER, while Actor+0x1d8 is an INLINE
# sub-object initialised by a copy that also copies the vptr (0x11aae8e0).
# Actor::getRegion() now tries both and requires each to carry BlockSource's own
# RTTI table ("11BlockSource", 1 standalone name copy) before handing it out -
# the check this accessor never had, and the reason a wrong +0x1c8 assumption
# looked like "the Dimension is missing" rather than "this is not a BlockSource".
# RETIRED the same minute: +0x38 is BlockSource's Dimension, proven from the
# constructor, but Actor turns out not to hold a BlockSource at all, so there is
# no BlockSource object to apply it to yet. Kept as documentation of the evidence.
vtable.dimensionGetId = Dimension:3

# Confirmed on device 2026-10-06, exactly as derived above: the accessor decoded
# itself to this offset against the live OverworldDimension object -
#   dimension probe: slot 3 decodes to ldr w0,[x0,#0x170]; ret
#   modapi.getPlayerDimension: OK
# Pinned because two independent tables (Dimension and OverworldDimension) put
# slot 3 at the same body, so the claim is corroborated; Dimension::
# getDimensionId() still decodes the slot when this pin is absent, which is what
# covers a build where it moved.
dat.dimensionIdField = d0x170

# ClientInstance getters verified offline against libminecraftpe-1.26.45.1.so
# (RTTI primary table @0x11e3b2c8). The live object may carry a shifted auxiliary
# table, so a slot number never authorises a call by itself.
# Primary slot 31 -> 0x94432d0. Its body copies the weak ref at this+0x218,
# resolves it and returns BlockSource* in x0 (or 0). getRegion() verifies the
# fixed 14-word prefix (wildcarding only its two BL immediates) and then requires
# BlockSource RTTI on the result; a shifted live table is therefore not called.
vtable.clientInstanceGetRegion = ClientInstance:31
# getLocalPlayer slot rung RETIRED. The 0x9443364 body itself is a correct,
# callable getter (mov x8,x0 = this scratch; copy ref at this+0x218 into a
# 0x19-byte local, test the +0x18 flag, return the pointer in x0). But the
# reference/BedrockTools INDEX of that getter (slot 32) is NOT its offset in
# this build's runtime primary vtable: on-device the clientInstanceGetLocalPlayer
# VIRTUAL through slot 32 faulted the game process (signal 11), while the
# byte-exact sig.clientInstanceGetLocalPlayer resolves the same function safely.
# So the getter is reached by signature only; getLocalPlayer() now tries sig
# before the slot, and this pin stays off so the shifted slot can never fire.
# vtable.clientInstanceGetLocalPlayerVt = ClientInstance:32
# Slot 174/175 (the identical non-const/const pair, reference getOptions at
# 177/178, 1:1 run of 31) reads exactly +0x2E0 - but the reference names slot 199
# getUITexture, and 199 is the one that loads +0x2E0. See the field table below:
# the pair that owns +0xC80 is 174/175 = getOptions.
# DISABLED: Options is an inline sub-object at +0xC80, so ClientInstance::
# getOptions() now certifies ci+0xC80 structurally (read-only, like GuiData's
# sub-object) and never needs the virtual. On-device the vcall through this
# shifted slot faulted the game process, so the pin is retired, not trusted.
# vtable.clientInstanceGetOptions = ClientInstance:174
# vtable.getGuiData = ClientInstance:101  ; REMOVED: the reference table names
# slot 101 getSkinRepositoryClientInterface and its body loads +0x660, so this
# was never a GuiData getter. GuiData is the inline sub-object at +0xDE0
# (dat.guiDataSubobject), certified structurally and verified on device.
# ---- field offsets resolved offline from libminecraftpe-1.26.45.1.so (RTTI +
#      vtable-getter scan; CI vtable @0x11e3b2c8, 436 slots), now cross-checked
#      against the symbolised 1.21.131 reference by the size-class alignment
#      (build/audit_pins.py, build/find_slot.py). Each row is ARM slot -> body ->
#      reference name, and a pin is only kept where the name and the load agree:
#        80  -> +0x178   getMinecraftGame_DEPRECATED
#        101 -> +0x660   getSkinRepositoryClientInterface   (NOT GuiData)
#        168/169 -> +0x180 (tail b)  getLevel(void)/const, 1:1 run 25/26
#        174/175 -> +0xc80           getOptions(void)/const, 1:1 run 31/32
#        187 -> +0x190   getLevelRenderer
#        199 -> +0x2e0   getUITexture                      (NOT Options)
#        293 -> +0x1a0   getPacketSender
#        31  -> 144-byte fn                 getRegion
#        32  -> 112-byte fn                 getLocalPlayer
#      Two earlier readings were wrong in exactly the way a bare offset cannot
#      show: +0xC80 was called Level because 174/175 was "the only identical
#      pair", and +0x2E0 was called Options because slot 199 returned a pointer.
#      Both indices belong to a different getter; the names settle it now.      ----
# MinecraftGame* = ClientInstance+0x178 (slot 80 getter; slot 83 thunk loads it).
dat.minecraftGameField = d0x178
# LevelRenderer* = ClientInstance+0x190 (slot 187; matches BedrockTools mLevelRenderer).
dat.levelRendererField = d0x190
# LoopbackPacketSender* = ClientInstance+0x1a0 (slot 293, sig-verified; ref 3.4 said 0xD0 = drift).
dat.loopbackPacketSenderField = d0x1a0
# Options* = ClientInstance+0xC80 (slot 174/175 = reference getOptions, 1:1 run
# of 31). The old d0x2E0 pin belonged to getUITexture.
dat.optionsField = d0xC80
# Level* = ClientInstance+0x180 (slot 168/169 = reference getLevel, 1:1 run of
# 25; body `ldr x0,[x0,#0x180]; b <null-check tail>`). Level is polymorphic, so
# the accessor still RTTI-validates whatever it reads before handing it out.
dat.levelField = d0x180
# dat.guiDataField = d0x660  ; REMOVED with slot 101: +0x660 is the SkinRepository
# client interface, not GuiData. GuiData is non-polymorphic and lives inline in
# ClientInstance, so it is pinned as the sub-object below and certified by its
# structural anchors (+0xA0 pane vtable, +0x140/+0x188 deque pairs) - never by a
# guessed field.
# GuiData is an inline sub-object of ClientInstance on 1.26.45.1 (no pointer
# member exists): the game's own addChatMessage 'this' = ci+0xDE0. Certified
# by structural anchors (+0xA0 pane vtable, +0x140/+0x188 deque pairs).
dat.guiDataSubobject = d0xDE0


# --- Actor/Player slots and fields, resolved offline -----------------------
# The stripped ARM Actor table (RTTI @0x1223ff18, 138 slots) was aligned against
# the symbolised 1.21.131 reference table (139 slots) by monotone size-class
# sequence alignment (build/align_slots.py): neither side's indices cross the
# version boundary on their own, so only slots inside a long 1:1 run were taken
# (the run length is quoted per pin). Field offsets came from the ARM bodies of
# those very slots, so they are this build's truth rather than a reference value.
#
# Actor position primarily sits behind a component pointer. On this build slot
# 13 has the getFiringPos-shaped four-word HFA body and is kept as a strictly
# decoded fallback, not treated as a cross-version "getPos" name:
#   Actor+0x208 movement component - pos at +0x00 (slot 13:
#     ldr x8,[x0,#0x208]; ldp s0,s1,[x8]; ldr s2,[x8,#8]) and motion at
#     +0x18/+0x1c/+0x20 (slot 23 lerpMotion stores its argument there).
#   Actor+0x218 rotation component - pitch +0x0, yaw +0x4, previous frame at
#     +0x8/+0xc (slot 17 yawSpeedInDegreesPerSecond subtracts +0xc from +0x4).
#   Actor+0x1c8 region - ClientInstance[31] getRegion inlines the actor load and
#     then reads +0x1c8 before its BlockSource call.
#   Actor+0x8 component container - slots 32/33 (isInvisible, canShowNameTag)
#     are `add x0,x0,#8; mov w1,<component index>; b <accessor>`.
#   Actor+0x251 alive byte, INVERTED (0 = alive): slot 47 is
#     ldrb w8,[x0,#0x251]; cmp w8,#0; cset w0,eq. isAlive() therefore calls the
#     virtual instead of pinning the flag, so no build's polarity leaks into the
#     API.
dat.actorMovementPtr = d0x208
dat.actorPosInMovement = d0x0
dat.actorMotionInMovement = d0x18
dat.playerRotPtr = d0x218
# CORRECTED 2026-10-06 by the on-device identity dump. This was pinned as
# dat.actorRegionField and Actor::getRegion() handed the pointer out unvalidated,
# so it "worked" while being the wrong class. The device reported its vptr RVA as
# 0x11d96858, whose RTTI name is
