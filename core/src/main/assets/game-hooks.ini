# AlterLauncher game hook rules for libminecraftpe.so
#
# Why this file exists: the native layer used to carry four byte patterns cut
# from one specific Minecraft build. Mojang recompiles and the addresses move,
# so all four stopped matching and every game hook went silent. The data now
# lives here so covering a new build is a text edit, not a rebuild.
#
# Format (line oriented, '#' and ';' start a comment):
#
#   [rule <name>]        opens a block. <name> is only used in the log.
#   min = <version>      inclusive lower bound, dotted numeric. Empty = open.
#   max = <version>      inclusive upper bound. Empty = open.
#   vtable.<key> = <Class>:<slot>
#                        resolved at RUNTIME through RTTI: the mangled class name
#                        is found in .rodata, from there the typeinfo object, from
#                        there the primary vtable, then offset 16 + 8*slot. Needs
#                        no byte pattern, so it survives a recompile for as long
#                        as the class layout holds. The slot is checked against
#                        the number of entries the table really has before it is
#                        used, and the vtable itself is validated (offset_to_top
#                        == 0 and its typeinfo pointer round-trips), so a wrong
#                        class name fails closed instead of patching garbage.
#   sig.<key> = <pattern>
#                        IDA-style byte pattern: "48 8B ?? ??", where "??" is any
#                        byte and "A?"/"?4" match half a byte. Only for functions
#                        that are NOT virtual - RTTI cannot reach those.
#
# The FIRST block whose version window contains the running game wins. Blocks
# are matched on the numeric prefix only, so a trailing "-beta" is ignored.
#
# A key that the winning block does not define is NOT guessed: that hook is
# skipped and the log says the build is not covered. If NO block matches at all,
# the data compiled into cpp/src/main/cpp/main.cpp applies, which is exactly the
# behaviour this file replaced. So deleting a line here is always safe; adding a
# wrong one only costs that one hook.

[rule minecraft-1.26]
min = 1.26.0.0
max =

# ClientInstance::update(bool) - the per-frame tick. Hooking it hands the
# launcher a live ClientInstance pointer, which every later game feature needs.
#
# Slot 25 is not a guess: the 1.21.131 macOS build has update(bool) at slot 25 of
# ClientInstance, and on the 1.26.45.1 ARM build slots 18..55 agree with it one
# for one by function size and call count (25 is the 3480-byte, 102-call giant).
# Verified on device: the resolved address equals the offline anchor
# 0x943ec54 (file offset from the .so base) and the hook fired once per frame.
vtable.clientInstanceUpdate = ClientInstance:25

# Not covered for 1.26, on purpose:
#   GuiData::addMessage, GuiData::sendClientMessage  - non-virtual, and the old
#       patterns do not occur in 1.26.45.1 at all. GuiData's primary vtable has
#       only 3 slots, so RTTI cannot reach them either.
#   MinecraftGame::joinMultiplayerGame               - non-virtual, same story.
#
# What was tried, so the next attempt starts further along:
#   * The old patterns still match two older ARM builds intact: 1.21.91-era
#     libminecraftpe-1291.so (update @0x6150b90, sendClientMessage @0x5faec4c,
#     addMessage @0x5faeef0) and 1.21.101-era libminecraftpe-121101.so (update
#     @0x629c7f8, addMessage @0x609219c, joinMultiplayerGame @0x62c4d48). Those
#     functions are the porting reference; addMessage is 0x344 bytes and touches
#     no literal at all, so there is no string to follow it with.
#   * Lang keys cannot anchor anything either: in 1.26 the .rodata strings are a
#     data-driven key pool, and no ADRP site in .text materialises them.
#   * All four builds are stripped (.dynsym only), and GuiData's TU has no
#     relocations pointing at its non-virtual members, so there is no name.
#   * Before spending that effort, check the address is even hookable: an inline
#     hook needs a free page within +/-128 MB of the target for shadowhook's
#     trampoline island, and libminecraftpe.so is mapped as one ~298 MB PT_LOAD.
#     On 1.26.45.1 the band from 128 MB to 170 MB into the mapping is therefore
#     unhookable, which is what killed ClientInstance::update (at 155 MB) and is
#     why it goes through a vtable slot instead. The native layer now reports
#     this directly: "cannot inline-hook <name> at 0x...: <mapping> ...".
#
# Minecraft::update is deliberately absent: it is the pre-RTTI way to obtain the
# game instance, and the vtable hook above owns it now.
