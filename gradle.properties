org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 表示将第三方库迁移到 AndroidX
android.enableJetifier = true

compileSDK=36
targetSDK=36
minSDK=26

# Bypass the local proxy (127.0.0.1:7890) for the Aliyun mirror so the build
# can fetch Kotlin/AGP artifacts even when the proxy is not running.
systemProp.http.nonProxyHosts=maven.aliyun.com|*.aliyun.com
systemProp.https.nonProxyHosts=maven.aliyun.com|*.aliyun.com